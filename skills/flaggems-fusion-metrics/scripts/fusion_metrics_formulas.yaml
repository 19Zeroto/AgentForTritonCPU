version: 1
# Expressions operate on TensorMeta (shape + element size), never real tensors.
formulas:
  flash_attention_forward:
    category: compute
    metric: logical_flops
    # Keep the historical benchmark metric convention: the two window
    # keywords are consumed in the order used by the injected implementation.
    inputs: {query: {position: 0}, key: {position: 1}, causal: {position: 4, default: false}, window_left: {keyword: window_size_right, default: -1}, window_right: {keyword: window_size_left, default: -1}}
    expression: "4 * dim(query, 0) * dim(query, 2) * attention_pair_count(dim(query, 1), dim(key, 1), causal, window_left, window_right) * dim(query, 3)"
    enabled: true
  flash_attn_varlen_func:
    category: compute
    metric: logical_flops
    inputs: {query: {position: 0}, cumulative_query_lengths: {position: 4}, used_key_lengths: {position: 7}, causal: {position: 11, default: false}, window_size: {position: 12, default: [-1, -1]}}
    expression: "varlen_attention_flops(query, cumulative_query_lengths, used_key_lengths, causal, window_size)"
    enabled: true
  flash_mla:
    category: compute
    metric: logical_flops
    inputs: {max_seqlen_pad: {position: 3}, batch_size: {position: 5}, query_length: {position: 6}, query_heads: {position: 8}, query_key_dim: {position: 10}, value_dim: {position: 11}}
    expression: "flash_mla_flops(max_seqlen_pad, batch_size, query_length, query_heads, query_key_dim, value_dim)"
    enabled: true
  flash_mla_sparse_fwd:
    category: compute
    metric: logical_flops
    inputs: {query: {position: 0}, indices: {position: 2}, value_dim: {position: 4, keyword: d_v}}
    expression: "sparse_mla_flops(query, indices, value_dim)"
    enabled: true
  sparse_mla_fwd_interface:
    category: compute
    metric: logical_flops
    inputs: {query: {position: 0}, indices: {position: 2}, value_dim: {position: 4, keyword: d_v}}
    expression: "sparse_mla_flops(query, indices, value_dim)"
    enabled: true
  rwkv_mm_sparsity:
    category: compute
    metric: logical_flops
    inputs: {key: {position: 0}, value: {position: 1}}
    expression: "2 * expected_nnz(key, 0.9) * dim(value, 1)"
    enabled: true
  apply_repetition_penalties:
    category: memory
    metric: logical_bytes
    inputs: {logits: {position: 0}, prompt_mask: {position: 1}, output_mask: {position: 2}, penalties: {position: 3}}
    expression: "2 * nbytes(logits) + nbytes(prompt_mask) + nbytes(output_mask) + nbytes(penalties)"
    enabled: true
  apply_rotary_pos_emb:
    category: memory
    metric: logical_bytes
    inputs: {query: {position: 0}, key: {position: 1}, cosine: {position: 2}, sine: {position: 3}}
    expression: "2 * nbytes(query) + 2 * nbytes(key) + nbytes(cosine) + nbytes(sine)"
    enabled: true
  concat_and_cache_mla:
    category: memory
    metric: logical_bytes
    inputs: {kv_content: {position: 0}, key_position: {position: 1}, kv_cache: {position: 2}, slot_mapping: {position: 3}, cache_dtype: {keyword: kv_cache_dtype, default: auto}, scale: {keyword: scale, default: null}}
    expression: "nbytes(kv_content) + nbytes(key_position) + output_nbytes_like(kv_cache, numel(kv_content) + numel(key_position)) + nbytes(slot_mapping) + (nbytes(scale) if cache_dtype != 'auto' else 0)"
    enabled: true
  cross_entropy_loss:
    category: memory
    metric: logical_bytes
    inputs: {logits: {position: 0}, target: {position: 1}, weight: {keyword: weight, default: null}, reduction: {keyword: reduction, default: mean}}
    expression: "nbytes(logits) + nbytes(target) + nbytes(weight) + output_nbytes_like(logits, numel(target) if reduction == 'none' else 1)"
    enabled: true
  dgeglu:
    category: memory
    metric: logical_bytes
    inputs: {gradient: {position: 0}, input: {position: 1}}
    expression: "nbytes(gradient) + 2 * nbytes(input)"
    enabled: true
  dreglu:
    category: memory
    metric: logical_bytes
    inputs: {gradient: {position: 0}, input: {position: 1}}
    expression: "nbytes(gradient) + 2 * nbytes(input)"
    enabled: true
  fused_add_rms_norm:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}, residual: {position: 1}, normalized_shape: {position: 2}, weight: {position: 3}}
    expression: "(3 if shape_numel(normalized_shape) >= 4096 else 2) * nbytes(input) + (3 if shape_numel(normalized_shape) >= 4096 else 2) * nbytes(residual) + nbytes(weight)"
    enabled: true
  geglu:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}}
    expression: "nbytes(input) + output_nbytes_like(input, numel(input) // 2)"
    enabled: true
  gelu_and_mul:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}, other: {position: 1}}
    expression: "2 * nbytes(input) + nbytes(other)"
    enabled: true
  get_scheduler_metadata:
    category: memory
    metric: logical_bytes
    inputs: {cache_sequence_lengths: {position: 6}}
    expression: "nbytes(cache_sequence_lengths)"
    enabled: true
  instance_norm:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}, weight: {position: 1}, bias: {position: 2}, running_mean: {position: 3, default: null}, running_variance: {position: 4, default: null}, use_input_stats: {position: 5, default: true}}
    expression: "(3 if numel(input) // dim(input, 0) // dim(input, 1) > 4096 else 2) * nbytes(input) + nbytes(weight) + nbytes(bias) + (2 if use_input_stats else 1) * nbytes(running_mean) + (2 if use_input_stats else 1) * nbytes(running_variance)"
    enabled: true
  moe_sum:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}, output: {position: 1}}
    expression: "nbytes(input) + nbytes(output)"
    enabled: true
  reglu:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}}
    expression: "nbytes(input) + output_nbytes_like(input, numel(input) // 2)"
    enabled: true
  reshape_and_cache:
    category: memory
    metric: logical_bytes
    inputs: {key: {position: 0}, value: {position: 1}, key_cache: {position: 2}, value_cache: {position: 3}, slot_mapping: {position: 4}}
    expression: "nbytes(key) + nbytes(value) + output_nbytes_like(key_cache, numel(key)) + output_nbytes_like(value_cache, numel(value)) + nbytes(slot_mapping)"
    enabled: true
  reshape_and_cache_flash:
    category: memory
    metric: logical_bytes
    inputs: {key: {position: 0}, value: {position: 1}, key_cache: {position: 2}, value_cache: {position: 3}, slot_mapping: {position: 4}}
    expression: "nbytes(key) + nbytes(value) + output_nbytes_like(key_cache, numel(key)) + output_nbytes_like(value_cache, numel(value)) + nbytes(slot_mapping)"
    enabled: true
  rwkv_ka_fusion:
    category: memory
    metric: logical_bytes
    inputs: {key: {position: 0}, key_key: {position: 1}, attention: {position: 2}, key_attention: {position: 3}}
    expression: "4 * nbytes(key) + nbytes(key_key) + nbytes(attention) + nbytes(key_attention)"
    enabled: true
  silu_and_mul:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}, other: {position: 1}}
    expression: "2 * nbytes(input) + nbytes(other)"
    enabled: true
  silu_and_mul_out:
    category: memory
    metric: logical_bytes
    inputs: {input: {position: 0}, other: {position: 1}}
    expression: "2 * nbytes(input) + nbytes(other)"
    enabled: true
  skip_layer_norm:
    category: memory
    metric: logical_bytes
    aliases: [skip_layernorm]
    inputs: {input: {position: 0}, residual: {position: 1}, normalized_shape: {position: 2}, weight: {position: 3}, bias: {position: 4}}
    expression: "(3 if shape_numel(normalized_shape) >= 4096 else 2) * nbytes(input) + (3 if shape_numel(normalized_shape) >= 4096 else 1) * nbytes(residual) + nbytes(weight) + nbytes(bias)"
    enabled: true
  moe_align_block_size_triton:
    category: memory
    metric: logical_bytes
    inputs: {topk_ids: {position: 0}, sorted_ids: {position: 3}, expert_ids: {position: 4}, tokens_post_pad: {position: 5}}
    expression: "nbytes(topk_ids) + nbytes(sorted_ids) + nbytes(expert_ids) + nbytes(tokens_post_pad)"
    enabled: false
    exclude_reason: "benchmark output buffer capacity is insufficient"
  topk_softmax:
    category: memory
    metric: logical_bytes
    inputs: {topk_weights: {position: 0}, topk_indices: {position: 1}, token_expert_indices: {position: 2}, gating_output: {position: 3}}
    expression: "nbytes(topk_weights) + nbytes(topk_indices) + nbytes(token_expert_indices) + nbytes(gating_output)"
    enabled: false
    exclude_reason: "benchmark arguments do not match the current product interface"
  weight_norm:
    category: memory
    metric: logical_bytes
    aliases: [weight_norm_interface]
    inputs: {value: {position: 0}, scale: {position: 1}}
    expression: "2 * nbytes(value) + nbytes(scale)"
    enabled: false
    exclude_reason: "accuracy coverage is skipped"
